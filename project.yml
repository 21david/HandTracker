name: HandTrack
options:
  bundleIdPrefix: com.david.handtrack
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  schemePathPrefix: ""
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  HandTrackiOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS/Sources
      - Packages/HandTrackCore/Sources
      - Packages/HandTrackPersistence/Sources
      - Packages/HandTrackSync/Sources
    resources:
      - Apps/iOS/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.david.handtrack.ios
        INFOPLIST_FILE: Apps/iOS/Resources/Info.plist
  HandTrackMac:
    type: application
    platform: macOS
    sources:
      - Apps/macOS/Sources
      - Packages/HandTrackCore/Sources
      - Packages/HandTrackPersistence/Sources
      - Packages/HandTrackSync/Sources
      - Packages/HandTrackMacInput/Sources
    resources:
      - Apps/macOS/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.david.handtrack.mac
        INFOPLIST_FILE: Apps/macOS/Resources/Info.plist
schemes:
  HandTrackiOS:
    build:
      targets:
        HandTrackiOS: all
    run:
      config: Debug
      executable: HandTrackiOS
  HandTrackMac:
    build:
      targets:
        HandTrackMac: all
    run:
      config: Debug
      executable: HandTrackMac
