name: r
options:
  bundleIdPrefix: com.david.handtrack
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  schemePathPrefix: ""
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  HandTrackiOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS/Sources
      - Apps/iOS/Resources/Assets.xcassets
      - Packages/HandTrackCore/Sources
      - Packages/HandTrackPersistence/Sources
      - Packages/HandTrackSync/Sources
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.david.handtrack.ios
        INFOPLIST_FILE: Apps/iOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HandTrackMac:
    type: application
    platform: macOS
    sources:
      - Apps/macOS/Sources
      - Apps/macOS/Resources/Assets.xcassets
      - path: Apps/macOS/Resources/plot_metric_histogram.py
        buildPhase: resources
      - Packages/HandTrackCore/Sources
      - Packages/HandTrackPersistence/Sources
      - Packages/HandTrackSync/Sources
      - Packages/HandTrackMacInput/Sources
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.david.handtrack.mac
        INFOPLIST_FILE: Apps/macOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: david.espinosa.21@gmail.com (5MRCT284D8)"
schemes:
  HandTrackiOS:
    build:
      targets:
        HandTrackiOS: all
    run:
      config: Debug
      executable: HandTrackiOS
  HandTrackMac:
    build:
      targets:
        HandTrackMac: all
    run:
      config: Debug
      executable: HandTrackMac
